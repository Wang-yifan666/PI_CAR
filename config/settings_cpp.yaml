# config/settings_cpp.yaml

dector:
  enable: true
  backend: process
  process:
    exec_path: detector_cpp/build/Release/detector_ncnn.exe
    args:
      - --param=models/ncnn/best.ncnn.param
      - --bin=models/ncnn/best.ncnn.bin
      - --classes=models/classes.txt
      - --source=video:data/test.mp4
      # - --source=camera:0
      - --imgsz=640
      - --threads=4
      - --conf=0.8
      - --nms=0.45
      - --out=out0
      - --debug=0
      - --topk=20

fsm:
  enable: true

# PC先关掉硬件相关线程，避免卡启动
uart:
  enable: false
gps:
  enable: false
patrol:
  enable: false

# 下面是测试命令，实际运行直接在命令行里运行
# .\detector_cpp\build\Release\detector_ncnn.exe --param=models/ncnn/best.ncnn.param --bin=models/ncnn/best.ncnn.bin --classes=models/classes.txt --source=video:data/test.mp4 --imgsz=640 --threads=4 --conf=0.8 --out=out0 --nms=0.45 --debug=0 --topk=20 | Select-Object -First 5
