# config/settings_cpp.yaml

# 说明：本文件用于 PC 调试链路。
# 实车（Linux / Pi）请优先使用 config/settings.yaml。

dector:
  enable: true
  backend: process       # onnx 录屏；要用 C++ 子进程则改为 process
  model_path: "models/onnx/best.onnx"
  class_file: "models/classes.txt"
  conf_threshold: 0.60
  target_classes: [0, 1, 2]
  show_window: true
  process:
    exec_path: detector_cpp/build/Release/detector_ncnn.exe  # 原值: detector_cpp/build/Release/detector_ncnn.exe 
    args:
      - --param=models/ncnn/best.ncnn.param
      - --bin=models/ncnn/best.ncnn.bin
      - --classes=models/classes.txt
      - --source=video:data/test.mp4  # 原值: video:data/test.mp4
      # - --source=camera:0           # camera:0
      - --imgsz=640
      - --threads=4
      - --conf=0.8
      - --nms=0.45
      - --out=out0
      - --debug=0
      - --topk=20

fsm:
  enable: true

uart:
  enable: true  # 原值: false 
gps:
  enable: true  # 原值: false 
  precision_threshold_m: 5.0   # 精度阈值（米）
  discard_limit: 3             # 连续无效多少次后触发停驶并标记 GPS 失效

# 周期状态日志
status_log:
  enable: true
  mode: "fast"           # fast ≈15s，slow ≈60s；若设置 interval_s 则优先生效
  interval_s: null
patrol:
  enable: true  # 原值: false 

