# 全局的配置文件

# 串口相关
uart:
  enable: true

  port: "COM10"   # 原值: "/dev/ttyAMA0"
  baudrate: 115200
  timeout: 1.0          # Serial.read 超时（秒）

  cmd_timeout: 2.0      # send_command 等待 OK/ERR 超时（秒）
  max_cmd_len: 64       # STM32 单条命令最大长度

  loop_sleep_s: 0.01    # 接收线程主循环 sleep
  cpu_sleep_s: 0.01     # 无数据时 sleep

  log_rx_line: true     # 打印数据
  log_tx_cmd: true      # 打印发送的命令
  log_gps: true         # 打印 GPS

# 视觉相关
dector :
  model_path : "models/onnx/best.onnx"  # 模型文件
  class_file : "models/classes.txt" # 类别文件

  conf_threshold : 0.60 # 置信度阈值
  target_classes : [0 , 1 , 2]   # 需要检测的类别

  show_window : false # 原值: true；树莓派无桌面环境建议关闭显示

  backend: "ncnn"      # onnx\process

  violation :             # 违规判定相关
    enable : true         # 开启

    cooldown_s: 60.0      # 该事件内不会存第二次

    ebike_class_id : 0 
    fire_class_id : 1 
    strip_class_id : 2

    # 判定足够近的条件，满足任一即为违规
    ebike_min_area_norm: 0.1  # 面积重合比例
    center_dist_norm: 0.4     # 中心点距离

  log_dedup :                   # 防止同一目标多次标记
    enable : true
    same_obj_px_th: 100         # 中心点移动小于该像素认为同一个目标
    same_obj_time_th: 1         # 在该时间窗口内被认为同一个物体
    same_obj_iou_th: 0          # IoU 大于该值认为同一个目标

  process:
    exec_path: "detector_cpp/build/Release/detector_ncnn" # 原值: "D:\\PI_CAR\\detector_cpp\\build\\Release\\detector_ncnn.exe"
    args: []
    opencv_bin: ""           # Windows 可选，若设置则自动加入 PATH
  
# fsm相关
fsm:
  default_mode: "M0002"  # M0001: 违规检测；M0002: 巡逻展示
  rate_hz : 5
  lost_timeout_s : 0.8

  # 目标类别筛选：空列表表示不筛选
  target_class_names : [0 , 1 , 2]

  stop_cmd: "S"

  desired_area_norm : 0.08

  # 巡逻策略
  patrol_vx : 0.15
  patrol_wz : 0.25
  patrol_wz_freq : 0.8
  
uploader : 
  enable : true                  
  endpoint : ""                     # 原值: "https://ultraman.tech/"；上线前替换为真实上传地址
  zip_root : "data"                 # 默认打包根目录
  zip_output_dir : "zips"           # zip 输出目录
  marker_suffix : "uploaded"        # 上传使用
  timeout_s: 30
  retry_s: 5
  zip_enable: true
  zip_marker_suffix: ".zipped"      # 打包使用
  zip_include_patterns: null
  zip_exclude_dirs: ["logs", "__pycache__"]
  zip_split_enable: true           # 由于cloudflare限制单文件大小，开启分片打包
  zip_max_bytes: 25165824          # 24 MB
  zip_overhead_bytes: 262144       # 256 KB 安全余量
  zip_part_name_fmt: "{task_id}.part{part_no:03d}.zip"
  zip_manifest_per_part: true      # 每个分卷都包含一个 manifest.txt，列出该分卷包含的文件
  zip_large_file_policy: "error"   # error / skip

# GPS 相关（新增：仅提供巡逻所需最小参数）
gps:
  enable: true
  mode: "replay"          # replay 表示使用NMEA进行模拟
  source: "uart"          # uart 表示来自 STM32 串口输出：GPS,lat,lon
  stale_timeout_s: 2.0    # 超过多少秒未更新就认为 GPS 失效（由 gps_service 判定）
  log_every_s: 2.0        # GPS 日志节流（秒）

# 巡逻相关
patrol:
  enable: true
  loop: true                  # 最后一个点走完回到第一个
  arrive_radius_m: 3.0        # 到点阈值(米)
  forward_sec: 4              # 每次直行的秒数
  turn_threshold_deg: 10      # 偏航超过多少度就先转向
  waypoints:
    - [22.540000, 113.934500]  
    - [22.540000, 113.934700] 
    - [22.540150, 113.934700] 
    - [22.540150, 113.934500]  

# 打包逻辑
data_pack:
  enable: true
  base_index: 0    # 基地的位置
  data_dir: "./datas"
  out_dir: "./packs"
  prefix: "datas"

# 展示逻辑
showcase:
  pi_test_only: false
  start_delay_s: 0.5
  repeat: false
  loop_interval_s: 0.2
  stop_cmd: S
  actions:
    - cmd: F0002
      duration: 2.0
      note: forward_1
    - cmd: R0090
      duration: 1.5
      note: right_turn_1
    - cmd: F0002
      duration: 2.0
      note: forward_2
    - cmd: R0090
      duration: 1.5
      note: right_turn_2
    - cmd: S
      duration: 0.3
      note: stop
